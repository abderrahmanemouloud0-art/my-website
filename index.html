<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>music from mouloud</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 50px;
        }

        h1 {
            color: #1d3557;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            color: #495057;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .image-container {
            margin: 20px auto;
            max-width: 600px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            padding: 10px;
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }

        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3);
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>مرحباً بك في الاغاني!</h1>
    <p>هذا الموقع يعرض لك الكثير من الاغاني الرائعة.</p>

    <div class="image-container">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="صورة توضيحية للموقع">
    </div>

    <!-- تم تغيير الأمر هنا لكي ينقلك لرابط الموقع الجديد عند الضغط -->
    <button class="btn" onclick="window.location.href='https://www.youtube.com/watch?v=_-YjO6KfEMk&list=RD_-YjO6KfEMk&start_radio=1'">اضغط هنا للسماع</button>

</body>
</html>
